name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q tmux shellcheck
      - run: tmux -V
      - run: shellcheck -s bash scripts/agent-state.sh agent-state.tmux test/run.sh
      - run: test/run.sh
